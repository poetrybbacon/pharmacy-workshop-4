<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet"><title>ตรวจสถานะระบบ</title><style>:root{--bg:#eaf4ff;--ink:#0b2a4a;--mute:#5b7694;--blue:#2b7fff;--sky:#9fd0ff;--ok:#0f9d6b;--okbg:#dcf7ec;--warn:#b86200;--warnbg:#fff0d6;--err:#c62f43;--errbg:#ffe3e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 95% -5%,#cfe6ff 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif;padding:20px 16px 48px}main{max-width:980px;margin:0 auto;display:grid;gap:18px}h1{font-size:1.8rem;font-weight:800;margin:0}h2{font-size:1.15rem;font-weight:800;margin:0 0 10px}a.back{color:var(--blue);font-weight:600;text-decoration:none}.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:5px 5px 0 var(--sky)}.note{color:var(--mute);margin:0}.hide{display:none}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #cfe0f2}th{color:var(--mute);font-weight:600}input,button{font:inherit}input{min-height:52px;border:2px solid var(--ink);border-radius:16px;padding:8px 14px;background:#fff;color:var(--ink)}button{min-height:52px;font-weight:800;border:3px solid var(--ink);border-radius:999px;padding:0 24px;background:var(--blue);color:#fff;cursor:pointer}button:disabled{background:#b9c8da;cursor:not-allowed}input:focus-visible,button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}.tag{display:inline-block;border-radius:999px;padding:0 10px;font-size:.9rem;font-weight:600;border:2px solid}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.err{background:var(--errbg);color:var(--err)}.box{border-radius:16px;padding:12px 16px;font-weight:600;background:var(--errbg);color:var(--err);border:2px solid var(--err)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.kpi{background:#f4f9ff;border:2px solid var(--sky);border-radius:20px;padding:12px 16px}.kpi b{display:block;font-size:2rem;line-height:1.3}</style></head><body><main>
<div><a class="back" href="index.html">‹ กลับหน้าแรก</a><h1>ตรวจสถานะระบบ</h1><p class="note">ข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p></div>
<section class="card"><h2>การเชื่อมต่อ</h2><p id="mode" class="note"></p><div class="wrap"><table><thead><tr><th>ส่วนที่ตรวจ</th><th>ผล</th><th>รายละเอียด</th></tr></thead><tbody id="rows"></tbody></table></div>
<p style="margin-top:14px"><button id="go" type="button">ตรวจอีกครั้ง</button> <button id="rs" class="hide" type="button">รีเซ็ตข้อมูลจำลอง</button></p></section>
<script src="mock-api.js"></script>
<script>
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
// เพิ่มรายการตรวจได้ที่นี่ (ok = ฟังก์ชันตัดสินจากสถานะและข้อมูล) ไม่ยิง /api/dispense เพราะจะตัดสต็อกจริง
const CHECKS=[
 {name:"ข้อมูลหลัก /api/data",url:"/api/data",ok:(s,j)=>s===200&&j&&j.drugs&&j.stock&&j.stock.meta&&j.stock.meta.as_of&&j.dispense_log},
 {name:"ไฟล์สำรอง drugs.json",url:"drugs.json",ok:(s,j)=>s===200&&!!j},
 {name:"ไฟล์สำรอง stock.json",url:"stock.json",ok:(s,j)=>s===200&&!!j},
 {name:"ไฟล์สำรอง dispense-log.json",url:"dispense-log.json",ok:(s,j)=>s===200&&!!j},
 {name:"ระบบผู้ดูแล /api/admin (ตอบ 401/403 = ปกติ)",url:"/api/admin",ok:s=>[200,401,403].includes(s)}
];
async function run(c){const t0=performance.now(),k=new AbortController(),to=setTimeout(()=>k.abort(),8000);
 try{const r=await fetch(c.url,{signal:k.signal});let j=null;try{j=await r.json()}catch(e){}
  return{pass:!!c.ok(r.status,j),msg:"HTTP "+r.status+" · "+Math.round(performance.now()-t0)+" ms"}}
 catch(e){return{pass:false,msg:e.name==="AbortError"?"หมดเวลา 8 วินาที":"เชื่อมต่อไม่ได้"}}finally{clearTimeout(to)}}
async function all(){window.apiMode().then(m=>{document.getElementById("mode").textContent=m==="server"?"โหมด: เซิร์ฟเวอร์จริง":"โหมด: จำลองในเบราว์เซอร์ (ไม่พบเซิร์ฟเวอร์ API ข้อมูลเก็บในเครื่องนี้)";document.getElementById("rs").classList.toggle("hide",m==="server")});const b=document.getElementById("rows"),g=document.getElementById("go");g.disabled=true;b.replaceChildren();
 const rs=CHECKS.map(c=>{const tr=el("tr"),s=el("td"),m=el("td","note","กำลังตรวจ...");s.append(el("span","tag warn","รอ"));tr.append(el("td","",c.name),s,m);b.append(tr);return{c,s,m}});
 await Promise.all(rs.map(async x=>{const r=await run(x.c);x.s.replaceChildren(el("span","tag "+(r.pass?"ok":"err"),r.pass?"✓ ปกติ":"✕ ผิดปกติ"));x.m.textContent=r.msg}));g.disabled=false}
document.getElementById("go").onclick=all;document.getElementById("rs").onclick=()=>{window.resetMock();all()};all();
</script></main></body></html>

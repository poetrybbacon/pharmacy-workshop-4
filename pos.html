<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าขายยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#0b2a4a;--mute:#5b7694;--blue:#2b7fff;--sky:#9fd0ff;--ok:#0f9d6b;--okbg:#dcf7ec;--warn:#b86200;--warnbg:#fff0d6;--err:#c62f43;--errbg:#ffe3e7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 95% -5%,#cfe6ff 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif;padding:20px 16px 48px}
main{max-width:980px;margin:0 auto;display:grid;gap:18px}
h1{font-size:1.8rem;font-weight:800;margin:0}
h2{font-size:1.15rem;font-weight:800;margin:0 0 10px}
a.back{color:var(--blue);font-weight:600;text-decoration:none}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:5px 5px 0 var(--sky)}
.note{color:var(--mute);margin:0}
.bar{background:var(--warnbg);color:var(--warn);border:2px solid var(--warn);border-radius:16px;padding:10px 16px;font-weight:600}
.hide{display:none}
.drugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.drug{font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:84px;background:#f4f9ff;border:2px solid var(--sky);border-radius:20px;padding:10px 14px}
.drug[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--ink)}
.drug .n{display:block;font-weight:800}
.drug .u{display:block}
.tag{display:inline-block;border-radius:999px;padding:0 10px;font-size:.9rem;font-weight:600;background:var(--warnbg);color:var(--warn);border:2px solid var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
label{display:grid;gap:4px;font-weight:600}
input{font:inherit;min-height:52px;border:2px solid var(--ink);border-radius:16px;padding:8px 14px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.sell{font:inherit;font-weight:800;min-height:60px;width:100%;margin-top:16px;border:3px solid var(--ink);border-radius:999px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.sell:disabled{background:#b9c8da;color:#fff;cursor:not-allowed;box-shadow:none}
.box{margin-top:14px;border-radius:16px;padding:12px 16px;font-weight:600}
.box.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.box.err{background:var(--errbg);color:var(--err);border:2px solid var(--err)}
.box p{margin:0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #cfe0f2}
th{color:var(--mute);font-weight:600}
</style>
</head>
<body>
<main>
  <div><a class="back" href="index.html">‹ กลับหน้าแรก</a><h1>หน้าขายยา</h1>
  <p class="note">ข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p></div>
  <div id="backup" class="bar hide">ข้อมูลสำรอง — ปิดปุ่มขายชั่วคราว</div>

  <section class="card">
    <h2>เลือกยา</h2>
    <div id="drugs" class="drugs"></div>
    <p id="empty" class="note hide">ไม่มียาที่พร้อมจ่าย</p>
    <div class="form">
      <label>จำนวน<input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1"></label>
      <label>รหัสผู้ป่วย<input id="patient" autocomplete="off" placeholder="เช่น P-0001"></label>
      <label>รหัสเภสัชกร<input id="pharm" autocomplete="off" placeholder="เช่น RPH-01"></label>
    </div>
    <button id="sell" class="sell" type="button">ขายยา</button>
    <div id="result" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>รายการจ่ายล่าสุด</h2>
    <div class="wrap"><table>
      <thead><tr><th>เวลา</th><th>SKU</th><th>ล็อต</th><th>จำนวน</th><th>ผู้ป่วย</th><th>ยอดเงิน</th></tr></thead>
      <tbody id="log"></tbody>
    </table></div>
  </section>
</main>
<script src="mock-api.js"></script>
<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
let state = {drugs:[], usable:{}, log:[], backup:false}, selected = null, busy = false;

// ขั้นที่ 1: ดึงข้อมูลจาก /api/data (หมดเวลา 8 วินาที) ถ้าไม่ครบให้โยน error
async function fetchJSON(url, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal:c.signal}); if (r.status !== 200) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const items = x => Array.isArray(x) ? x : (x && Array.isArray(x.items) ? x.items : null);

async function loadData() {
  let d, backup = false;
  try {
    d = await fetchJSON('/api/data', 8000);
    if (!items(d.drugs) || !d.stock || !items(d.stock) || !d.stock.meta || !d.stock.meta.as_of || !items(d.dispense_log)) throw new Error('bad');
  } catch (e) {
    // ขั้นที่ 2 (สำรอง): อ่านไฟล์ JSON ในเครื่อง แล้วปิดปุ่มขาย
    backup = true;
    try {
      const [a,b,c] = await Promise.all(['drugs.json','stock.json','dispense-log.json'].map(u => fetchJSON(u, 8000)));
      d = {drugs:a, stock:b, dispense_log:c};
    } catch (e2) { d = {drugs:{items:[]}, stock:{meta:{as_of:''},items:[]}, dispense_log:{items:[]}}; }
  }
  const asOf = (d.stock.meta && d.stock.meta.as_of) || '';
  const inactive = new Set(((d.catalog && items(d.catalog)) || []).filter(c => c.is_active === false).map(c => c.sku));
  const usable = {};
  for (const s of items(d.stock) || []) {
    const ok = (s.status === undefined || s.status === 'active') && s.expiry && s.expiry >= asOf && s.qty_on_hand > 0;
    if (ok) usable[s.sku] = (usable[s.sku] || 0) + s.qty_on_hand;
  }
  const drugs = (items(d.drugs) || []).filter(x => !inactive.has(x.sku) && usable[x.sku] > 0);
  let log = (items(d.dispense_log) || []).slice();
  const ts = r => r.dispensed_at || r.created_at || r.ts || '';
  log = log.some(r => ts(r)) ? log.sort((a,b) => ts(b).localeCompare(ts(a))) : log.reverse();
  state = {drugs, usable, log:log.slice(0,8), backup};
  if (selected && !usable[selected]) selected = null;
  render();
}

function render() {
  $('backup').classList.toggle('hide', !state.backup);
  const box = $('drugs'); box.replaceChildren();
  $('empty').classList.toggle('hide', state.drugs.length > 0);
  for (const g of state.drugs) {
    const b = el('button', 'drug'); b.type = 'button';
    b.setAttribute('aria-pressed', String(g.sku === selected));
    b.append(el('span','n', g.name_th || g.name || g.sku), el('span','u', g.sku + ' · ใช้ได้ ' + state.usable[g.sku]));
    if (g.reorder_level !== undefined && state.usable[g.sku] < g.reorder_level) b.append(el('span','tag','⚠ ต่ำกว่าจุดสั่งซื้อ'));
    b.onclick = () => { selected = g.sku; render(); };
    box.append(b);
  }
  const body = $('log'); body.replaceChildren();
  for (const r of state.log) {
    const tr = el('tr');
    for (const v of [String(r.dispensed_at || r.created_at || r.ts || '-').replace('T',' ').slice(0,16), r.sku, r.lot, r.qty, r.patient_code, r.amount]) tr.append(el('td', '', v === undefined || v === null ? '-' : String(v)));
    body.append(tr);
  }
  $('sell').disabled = busy || state.backup;
}

function show(kind, lines) {
  const b = el('div', 'box ' + kind); for (const t of lines) b.append(el('p', '', t));
  $('result').replaceChildren(b);
}

// ขั้นที่ 3: ตรวจเฉพาะรูปแบบข้อมูล แล้ว POST /api/dispense ปล่อยให้เซิร์ฟเวอร์เลือกล็อตและตัดสินยอด
async function sell() {
  const qtyText = $('qty').value.trim(), qty = Number(qtyText);
  const patient = $('patient').value.trim(), pharm = $('pharm').value.trim();
  if (!selected) return show('err', ['กรุณาเลือกยาก่อน']);
  if (!/^\d+$/.test(qtyText) || qty < 1) return show('err', ['จำนวนต้องเป็นจำนวนเต็มตั้งแต่ 1 ขึ้นไป']);
  if (!patient || !pharm) return show('err', ['กรุณากรอกรหัสผู้ป่วยและรหัสเภสัชกร']);
  busy = true; render();   // ปิดปุ่มจนกว่าจะได้คำตอบ กันกดซ้ำ
  try {
    const r = await fetch('/api/dispense', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sku:selected, qty, patient_code:patient, pharmacist_code:pharm})});
    const j = await r.json();
    if (j && j.ok === true) {
      // ขั้นที่ 4: แสดงผลตามที่เซิร์ฟเวอร์ตอบ ล้างรหัสผู้ป่วย แล้วดึง /api/data ใหม่
      show('ok', ['จ่ายแล้ว', ...(j.lines || []).map(l => 'ล็อต ' + l.lot + ' ตัด ' + l.qty), 'ยอดใช้ได้ ก่อน ' + j.usable_before + ' → หลัง ' + j.usable_after, ...(j.amount !== undefined ? ['ยอดเงิน ' + j.amount + ' บาท'] : [])]);
      $('patient').value = '';
      busy = false; await loadData();
    } else show('err', [(j && j.message) || 'ไม่สำเร็จ กรุณาลองใหม่']);
  } catch (e) { show('err', ['เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่']); }
  finally { busy = false; render(); }
}
$('sell').onclick = sell;
loadData();
</script>
</body>
</html>

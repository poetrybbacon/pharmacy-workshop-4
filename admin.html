<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet"><title>จัดการระบบ (ผู้ดูแล)</title><style>:root{--bg:#eaf4ff;--ink:#0b2a4a;--mute:#5b7694;--blue:#2b7fff;--sky:#9fd0ff;--ok:#0f9d6b;--okbg:#dcf7ec;--warn:#b86200;--warnbg:#fff0d6;--err:#c62f43;--errbg:#ffe3e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 95% -5%,#cfe6ff 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif;padding:20px 16px 48px}main{max-width:980px;margin:0 auto;display:grid;gap:18px}h1{font-size:1.8rem;font-weight:800;margin:0}h2{font-size:1.15rem;font-weight:800;margin:0 0 10px}a.back{color:var(--blue);font-weight:600;text-decoration:none}.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:5px 5px 0 var(--sky)}.note{color:var(--mute);margin:0}.hide{display:none}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #cfe0f2}th{color:var(--mute);font-weight:600}input,button{font:inherit}input{min-height:52px;border:2px solid var(--ink);border-radius:16px;padding:8px 14px;background:#fff;color:var(--ink)}button{min-height:52px;font-weight:800;border:3px solid var(--ink);border-radius:999px;padding:0 24px;background:var(--blue);color:#fff;cursor:pointer}button:disabled{background:#b9c8da;cursor:not-allowed}input:focus-visible,button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}.tag{display:inline-block;border-radius:999px;padding:0 10px;font-size:.9rem;font-weight:600;border:2px solid}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.err{background:var(--errbg);color:var(--err)}.box{border-radius:16px;padding:12px 16px;font-weight:600;background:var(--errbg);color:var(--err);border:2px solid var(--err)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.kpi{background:#f4f9ff;border:2px solid var(--sky);border-radius:20px;padding:12px 16px}.kpi b{display:block;font-size:2rem;line-height:1.3}</style><style>.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{background:#fff;color:var(--ink)}.tabs button[aria-pressed=true]{background:var(--blue);color:#fff}</style></head><body><main>
<div><a class="back" href="index.html">‹ กลับหน้าแรก</a><h1>จัดการระบบ (ผู้ดูแล)</h1><p class="note">ข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p></div>
<section class="card" id="gate"><h2>รหัสผู้ดูแล</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="code" type="password" autocomplete="off" placeholder="กรอกรหัสผู้ดูแล"><button id="login" type="button">เข้าสู่ระบบ</button></div><div id="err" class="box hide" style="margin-top:12px"></div></section>
<section class="card hide" id="panel"><div class="tabs" id="tabs"></div><div class="wrap" style="margin-top:14px"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></section>
<script src="mock-api.js"></script>
<script>
const $=i=>document.getElementById(i),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let data=null,tab=0;
// ตารางที่แสดง: [ชื่อแท็บ, ฟังก์ชันดึงแถว, คอลัมน์[หัว, ฟิลด์]] แก้บรรทัดเดียวเพื่อเพิ่ม/ลบคอลัมน์
const TABS=[
 ["บัญชียา",d=>d.drugs.items,[["SKU","sku"],["ชื่อยา","name_th|name"],["จุดสั่งซื้อ","reorder_level"],["ราคา (บาท)","price"]]],
 ["คลังรายล็อต",d=>d.stock.items,[["SKU","sku"],["ล็อต","lot"],["หมดอายุ","expiry"],["คงเหลือ","qty_on_hand"],["สถานะ","status"]]],
 ["รายการจ่าย",d=>d.dispense_log.items.slice(-100).reverse(),[["รหัสจ่าย","dispense_id"],["SKU","sku"],["ล็อต","lot"],["จำนวน","qty"],["ผู้ป่วย","patient_code"],["เภสัชกร","pharmacist_code"],["ยอดเงิน (บาท)","amount"]]]
];
const pick=(r,f)=>{for(const k of f.split("|"))if(r[k]!==undefined&&r[k]!==null)return String(r[k]);return "-"};
function render(){
 $("tabs").replaceChildren(...TABS.map((t,i)=>{const b=el("button","",t[0]);b.type="button";b.setAttribute("aria-pressed",String(i===tab));b.onclick=()=>{tab=i;render()};return b}));
 const [,rows,cols]=TABS[tab],tr=el("tr");for(const c of cols)tr.append(el("th","",c[0]));$("th").replaceChildren(tr);
 $("tb").replaceChildren(...rows(data).map(r=>{const x=el("tr");for(const c of cols)x.append(el("td","",pick(r,c[1])));return x}));
}
// เรียก /api/admin พร้อมรหัสใน header X-Admin-Code (ผลลัพธ์รูปแบบเดียวกับ /api/data) รหัสเก็บในหน่วยความจำเท่านั้น
async function login(){
 const b=$("login"),e=$("err"),code=$("code").value.trim();e.classList.add("hide");
 if(!code){e.textContent="กรุณากรอกรหัสผู้ดูแล";e.classList.remove("hide");return}
 b.disabled=true;
 try{const r=await fetch("/api/admin",{headers:{"X-Admin-Code":code}});
  if(r.status===401||r.status===403)throw new Error("รหัสผู้ดูแลไม่ถูกต้อง");
  if(r.status!==200)throw new Error("ระบบตอบกลับผิดปกติ (HTTP "+r.status+")");
  data=await r.json();$("gate").classList.add("hide");$("panel").classList.remove("hide");$("code").value="";render();
 }catch(x){e.textContent=x.message&&x.message.startsWith("ร")?x.message:"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่";e.classList.remove("hide")}
 finally{b.disabled=false}}
$("login").onclick=login;$("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></main></body></html>
